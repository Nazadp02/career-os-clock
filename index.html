<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<title>Career OS Pixel Clock</title>

				<style>
					@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

					/* ========================================
					COLORES
					======================================== */

					:root {
					--notion-bg: ##0D0D0D;
					--white: #ffffff;
					--soft-white: rgba(255, 255, 255, 0.65);
					--border: rgba(255, 255, 255, 0.85);
					}

					/* ========================================
					DOCUMENTO
					======================================== */

					html,
					body {
					width: 100%;
					height: 100%;
					margin: 0;
					padding: 0;

					/*
					Fondo oscuro para integrarse visualmente
					con la página oscura de Notion.
					*/
					background: var(--notion-bg) !important;
					overflow: hidden;
					}

					body {
					display: flex;
					align-items: center;
					justify-content: center;

					font-family: "Press Start 2P", monospace;
					color: var(--white);
					}

					/* ========================================
					RELOJ
					======================================== */

					.clock {
					position: relative;

					width: min(calc(100% - 28px), 760px);
					min-height: 230px;

					padding: 26px 30px 24px;

					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;

					/*
					El reloj no tiene fondo propio.
					Se integra con el fondo oscuro.
					*/
					background: transparent;

					/*
					Borde principal
					*/
					border: 2px solid var(--border);

					/*
					Esquinas pixel art
					*/
					clip-path: polygon(
					12px 0,
					calc(100% - 12px) 0,

					calc(100% - 12px) 4px,
					calc(100% - 4px) 4px,

					calc(100% - 4px) 12px,
					100% 12px,

					100% calc(100% - 12px),

					calc(100% - 4px) calc(100% - 12px),
					calc(100% - 4px) calc(100% - 4px),

					calc(100% - 12px) calc(100% - 4px),
					calc(100% - 12px) 100%,

					12px 100%,

					12px calc(100% - 4px),
					4px calc(100% - 4px),

					4px calc(100% - 12px),
					0 calc(100% - 12px),

					0 12px,

					4px 12px,
					4px 4px,

					12px 4px
					);
					}

					/* ========================================
					DÍA
					======================================== */

					.day {
					margin-bottom: 22px;

					font-size: clamp(11px, 2.1vw, 18px);
					letter-spacing: 0.12em;

					color: var(--soft-white);

					text-align: center;
					}

					/* ========================================
					HORA
					======================================== */

					.time {
					display: flex;

					align-items: center;
					justify-content: center;

					gap: clamp(5px, 1vw, 12px);

					min-height: clamp(70px, 14vw, 126px);

					line-height: 1;
					}

					/* Dígitos */

					.digit {
					display: inline-grid;

					place-items: center;

					width: 0.74em;
					height: 1em;

					font-size: clamp(52px, 11vw, 112px);

					line-height: 1;

					color: var(--white);

					transform-style: preserve-3d;
					transform-origin: center;
					}

					/* Animación */

					.digit.flip {
					animation: pixelFlip 320ms steps(5, end);
					}

					/* Dos puntos */

					.colon {
					font-size: clamp(46px, 9vw, 92px);

					line-height: 1;

					color: var(--white);

					transform: translateY(-0.03em);
					}

					/* ========================================
					FECHA
					======================================== */

					.date {
					margin-top: 24px;

					font-size: clamp(8px, 1.5vw, 13px);

					letter-spacing: 0.08em;

					color: var(--soft-white);

					text-align: center;
					}

					/* ========================================
					ANIMACIÓN PIXEL FLIP
					======================================== */

					@keyframes pixelFlip {

					0% {
					transform: rotateX(0deg) scaleY(1);
					opacity: 1;
					}

					35% {
					transform: rotateX(78deg) scaleY(0.82);
					opacity: 0.68;
					}

					36% {
					transform: rotateX(-78deg) scaleY(0.82);
					opacity: 0.68;
					}

					100% {
					transform: rotateX(0deg) scaleY(1);
					opacity: 1;
					}
					}

					/* ========================================
					RESPONSIVE
					======================================== */

					@media (max-width: 430px) {

					.clock {
					min-height: 210px;
					padding: 22px 18px;
					}

					.day {
					margin-bottom: 18px;
					}

					.date {
					margin-top: 20px;
					}
					}

				</style>
			</head>

	<body>

		<main class="clock" aria-label="Reloj digital">

			<!-- DÍA -->

			<div
				class="day"
				id="day"
    >
				VIERNES
			</div>


			<!-- HORA -->

			<div
				class="time"
				aria-live="polite"
    >

				<span class="digit" id="h1">
					0
				</span>

				<span class="digit" id="h2">
					0
				</span>


				<span class="colon">
					:
				</span>


				<span class="digit" id="m1">
					0
				</span>

				<span class="digit" id="m2">
					0
				</span>

			</div>


			<!-- FECHA -->

			<div
				class="date"
				id="date"
    >
				22 DE AGOSTO · 2026
			</div>

		</main>


		<script>

			/* ========================================
			NOMBRES EN ESPAÑOL
			======================================== */

			const dayNames = [

			"DOMINGO",
			"LUNES",
			"MARTES",
			"MIÉRCOLES",
			"JUEVES",
			"VIERNES",
			"SÁBADO"

			];


			const monthNames = [

			"ENERO",
			"FEBRERO",
			"MARZO",
			"ABRIL",
			"MAYO",
			"JUNIO",

			"JULIO",
			"AGOSTO",
			"SEPTIEMBRE",
			"OCTUBRE",
			"NOVIEMBRE",
			"DICIEMBRE"

			];


			/* ========================================
			CONTROL DE DÍGITOS
			======================================== */

			const previous = {

			h1: null,
			h2: null,
			m1: null,
			m2: null

			};


			/* ========================================
			CAMBIAR UN DÍGITO
			======================================== */

			function setDigit(
			id,
			value,
			animate = true
			) {

			const element =
			document.getElementById(id);


			if (
			previous[id] !== value
			) {

			/*
			Elimina la animación anterior
			*/

			element.classList.remove(
			"flip"
			);


			/*
			Fuerza el reinicio
			de la animación
			*/

			void element.offsetWidth;


			/*
			Ejecuta la animación
			solo después de la
			primera carga
			*/

			if (
			animate &&
			previous[id] !== null
			) {

			element.classList.add(
			"flip"
			);

			}


			/*
			Cambia el número
			*/

			element.textContent =
			value;


			/*
			Guarda el valor
			*/

			previous[id] =
			value;

			}

			}


			/* ========================================
			ACTUALIZAR RELOJ
			======================================== */

			function updateClock() {

			const now =
			new Date();


			/*
			Hora
			*/

			const hours =
			String(
			now.getHours()
			).padStart(
			2,
			"0"
			);


			/*
			Minutos
			*/

			const minutes =
			String(
			now.getMinutes()
			).padStart(
			2,
			"0"
			);


			/*
			Actualizar dígitos
			*/

			setDigit(
			"h1",
			hours[0]
			);

			setDigit(
			"h2",
			hours[1]
			);

			setDigit(
			"m1",
			minutes[0]
			);

			setDigit(
			"m2",
			minutes[1]
			);


			/*
			Actualizar día
			*/

			document.getElementById(
			"day"
			).textContent =
			dayNames[
			now.getDay()
			];


			/*
			Actualizar fecha
			*/

			document.getElementById(
			"date"
			).textContent =

			`${now.getDate()} DE ${
			monthNames[
			now.getMonth()
			]
			} · ${
			now.getFullYear()
			}`;

			}


			/* ========================================
			PRIMERA CARGA
			======================================== */

			updateClock();


			/* ========================================
			SINCRONIZACIÓN CON EL MINUTO
			======================================== */

			const delay =

			60000 -

			(
			Date.now()
			%
			60000
			)

			+ 20;


			/*
			Espera al siguiente minuto
			real y después actualiza
			cada 60 segundos.
			*/

			setTimeout(

			() => {

			updateClock();

			setInterval(
			updateClock,
			60000
			);

			},

			delay

			);

		</script>

	</body>
</html>
